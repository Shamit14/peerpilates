databases:
  - name: peerpilates-db
    databaseName: peerpilates
    user: peerpilates
    plan: free
    region: oregon

services:
  # Single Full-Stack Service — FastAPI serves the built React frontend
  - type: web
    name: peerpilates-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: >-
      npm install --prefix frontend &&
      npm run build --prefix frontend &&
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peerpilates-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://peerpilates-api.onrender.com
      - key: BACKEND_URL
        value: https://peerpilates-api.onrender.com
      - key: VITE_API_URL
        value: https://peerpilates-api.onrender.com
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: NODE_VERSION
        value: 20.18.0
