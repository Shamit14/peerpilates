databases:
  - name: eprep-ai-db
    databaseName: eprep_ai
    user: eprep_ai
    plan: free
    region: oregon

services:
  # Backend API Service
  - type: web
    name: eprep-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eprep-ai-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.4"

  # Frontend Static Site
  - type: web
    name: eprep-ai-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
